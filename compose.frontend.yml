services:
  iam:
    environment:
      ACTIVATION_LINK_BASE_URL: "${ACTIVATION_LINK_BASE_URL:-${SMARTGN_PUBLIC_ORIGIN:-http://localhost:${SMARTGN_FRONTEND_PORT:-4200}}/activate-password}"
      PASSWORD_RESET_LINK_BASE_URL: "${PASSWORD_RESET_LINK_BASE_URL:-${SMARTGN_PUBLIC_ORIGIN:-http://localhost:${SMARTGN_FRONTEND_PORT:-4200}}/reset-password}"
  api-gateway:
    environment:
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:${SMARTGN_FRONTEND_PORT:-4200},http://127.0.0.1:${SMARTGN_FRONTEND_PORT:-4200},http://localhost:5500,http://127.0.0.1:5500,https://ventrax-upc.github.io}"
  frontend:
    image: ${SMARTGN_FRONTEND_IMAGE:-smartgn-frontend:local}
    environment:
      SMARTGN_GATEWAY_UPSTREAM: "${SMARTGN_GATEWAY_UPSTREAM:-api-gateway:8000}"
      SMARTGN_DNS_RESOLVER: "${SMARTGN_DNS_RESOLVER:-127.0.0.11}"
    ports:
      - "${SMARTGN_FRONTEND_BIND:-127.0.0.1}:${SMARTGN_FRONTEND_PORT:-4200}:80"
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
