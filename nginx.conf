server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        return 200 "ok\n";
    }

    location ~ ^/api/v1(?:/|$) {
        client_max_body_size 11m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway api-gateway:8000;
        proxy_pass http://$gateway;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
