server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        return 200 "ok\n";
    }

    location ~ ^/api/v1(?:/|$) {
        client_max_body_size 11m;
        resolver ${SMARTGN_DNS_RESOLVER} valid=10s ipv6=off;
        set $gateway ${SMARTGN_GATEWAY_UPSTREAM};
        proxy_pass http://$gateway;
        proxy_set_header Host $host;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /i18n/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
