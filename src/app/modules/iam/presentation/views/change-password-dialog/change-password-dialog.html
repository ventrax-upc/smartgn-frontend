<h2 mat-dialog-title class="dialog-title">
  <mat-icon>lock_reset</mat-icon>
  {{ 'ui.changePassword' | translate }}
</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog-content">
    <p class="dialog-subtitle">
      {{ 'ui.useYourCurrentPasswordToConfirmThe' | translate }}
    </p>

    <div class="field">
      <label for="current-password">{{ 'ui.currentPassword' | translate }}</label>
      <input
        id="current-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
      />
    </div>

    <div class="field">
      <label for="new-password">{{ 'ui.newPassword' | translate }}</label>
      <input
        id="new-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label for="confirm-password">{{ 'ui.confirmNewPassword' | translate }}</label>
      <input
        id="confirm-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </div>

    <button appPasswordToggle class="btn btn-secondary btn-sm show-toggle" [visible]="showPassword()" [withLabel]="true" (click)="toggleShowPassword()"></button>

    @if (form.invalid && submitted()) {
      <div class="alert alert-error" role="alert">{{ 'ui.fillEveryFieldTheNewPasswordNeeds' | translate }}</div>
    }

    @if (error(); as message) {
      <div class="alert alert-error" role="alert">{{ message | translate }}</div>
    }
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions" align="end">
    <button class="btn btn-secondary" type="button" (click)="dialogRef.close(false)"><mat-icon>close</mat-icon> {{ 'ui.cancel' | translate }}</button>
    <button class="btn btn-primary" type="submit" [disabled]="loading()">
      <mat-icon>check</mat-icon> {{ loading() ? ('ui.saving' | translate) : ('ui.saveNewPassword' | translate) }}
    </button>
  </mat-dialog-actions>
</form>
