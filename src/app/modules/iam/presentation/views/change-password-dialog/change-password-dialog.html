<h2 mat-dialog-title class="dialog-title">
  <mat-icon>lock_reset</mat-icon>
  Change password
</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog-content">
    <p class="dialog-subtitle">
      Use your current password to confirm the change. All other sessions will be
      signed out.
    </p>

    <div class="field">
      <label for="current-password">Current password</label>
      <input
        id="current-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
      />
    </div>

    <div class="field">
      <label for="new-password">New password</label>
      <input
        id="new-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label for="confirm-password">Confirm new password</label>
      <input
        id="confirm-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </div>

    <button type="button" class="show-toggle" (click)="toggleShowPassword()">
      <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      {{ showPassword() ? 'Hide passwords' : 'Show passwords' }}
    </button>

    @if (form.invalid && form.touched) {
      <div class="alert alert-error">Fill every field; the new password needs 8+ characters.</div>
    }

    @if (error(); as message) {
      <div class="alert alert-error">{{ message }}</div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialogRef.close(false)">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Saving...' : 'Save new password' }}
    </button>
  </mat-dialog-actions>
</form>
