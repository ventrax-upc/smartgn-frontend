<h2 mat-dialog-title class="dialog-title">
  <mat-icon>lock_reset</mat-icon>
  {{ 'ui.changePassword' | translate }}
</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog-content">
    <p class="dialog-subtitle">
      {{ 'ui.useYourCurrentPasswordToConfirmThe' | translate }}
    </p>

    <div class="field">
      <label for="current-password">{{ 'ui.currentPassword' | translate }}</label>
      <input
        id="current-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
      />
    </div>

    <div class="field">
      <label for="new-password">{{ 'ui.newPassword' | translate }}</label>
      <input
        id="new-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label for="confirm-password">{{ 'ui.confirmNewPassword' | translate }}</label>
      <input
        id="confirm-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </div>

    <button type="button" class="show-toggle" (click)="toggleShowPassword()">
      <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      {{ showPassword() ? ('ui.hidePasswords' | translate) : ('ui.showPasswords' | translate) }}
    </button>

    @if (form.invalid && form.touched) {
      <div class="alert alert-error">{{ 'ui.fillEveryFieldTheNewPasswordNeeds' | translate }}</div>
    }

    @if (error(); as message) {
      <div class="alert alert-error">{{ message | translate }}</div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialogRef.close(false)">{{ 'ui.cancel' | translate }}</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      {{ loading() ? ('ui.saving' | translate) : ('ui.saveNewPassword' | translate) }}
    </button>
  </mat-dialog-actions>
</form>
