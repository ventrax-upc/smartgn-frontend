<h2 mat-dialog-title class="confirm-dialog__title">
  <mat-icon
    class="confirm-dialog__icon"
    [class.confirm-dialog__icon--danger]="(data.tone ?? defaults.tone) === 'danger'">
    {{ data.iconName ?? defaults.iconName }}
  </mat-icon>
  {{ data.titleKey | translate }}
</h2>

<mat-dialog-content class="confirm-dialog__content">
  <p>{{ data.messageKey | translate }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="confirm-dialog__actions">
  <button class="btn btn-secondary" type="button" (click)="cancel()">
    <mat-icon>close</mat-icon> {{ (data.cancelKey ?? defaults.cancelKey) | translate }}
  </button>
  <button
    class="btn"
    type="button"
    [class.btn-danger]="(data.tone ?? defaults.tone) === 'danger'"
      [class.btn-primary]="(data.tone ?? defaults.tone) !== 'danger'"
    (click)="confirm()">
    <mat-icon>check</mat-icon> {{ (data.confirmKey ?? defaults.confirmKey) | translate }}
  </button>
</mat-dialog-actions>
