name: Frontend CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build -- --configuration production

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the deployment image
        run: |
          docker build -t smartgn-frontend:ci .
          docker network create smartgn-ci
          trap 'docker rm -f smartgn-frontend-ci smartgn-gateway-ci >/dev/null 2>&1 || true; docker network rm smartgn-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name smartgn-gateway-ci --network smartgn-ci --network-alias gateway-ci node:22-alpine node -e '
            require("node:http").createServer((req, res) => {
              if (req.url === "/api/v1/test?ci=1") {
                res.end("gateway-ok");
              } else {
                res.writeHead(404).end();
              }
            }).listen(8000, "0.0.0.0");
          '
          docker run -d --name smartgn-frontend-ci --network smartgn-ci -e SMARTGN_GATEWAY_UPSTREAM=gateway-ci:8000 -p 127.0.0.1::80 smartgn-frontend:ci
          base="http://$(docker port smartgn-frontend-ci 80/tcp)"
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused "$base/healthz"
          curl --fail --silent "$base/activate-password" | grep -q '<app-root'
          test "$(curl --fail --silent --retry 5 --retry-all-errors "$base/api/v1/test?ci=1")" = gateway-ok
